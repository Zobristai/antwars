<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antwars — live</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <style>
      /* antwar's page styles shared by every view: the tokens, the waiting panel, tooltips, the agent address row and the
         replay transport. The spectator HUDs carry their own (web/src/ui/ui.css, web/src/ui/deck/deck.css). System sans
         throughout, the tooltips included; Plex Mono only for the MCP address. */
      :root {
        --aw-bg: #121719;
        --aw-surface: #1a2225;
        --aw-raise: #293337;
        --aw-raise-hover: #364146;
        --aw-on: #e9eff0;
        --aw-ink: #e9eff0;
        --aw-ink-bright: #f8fcfc;
        --aw-ink-2: rgba(233, 239, 240, 0.76);
        --aw-ink-3: rgba(233, 239, 240, 0.63); /* metadata ink: at least 4.5:1 on the surface, a raised row and the page (checked by test/spectator/contrast.test.ts) */
        --aw-line: rgba(233, 239, 240, 0.12);
        --aw-c0: #ffb000;
        --aw-c1: #00c2ff;
        --aw-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
        --aw-mono: "IBM Plex Mono", ui-monospace, monospace;
        --aw-tap: 36px;
        --aw-gutter: 24px;
        --aw-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --aw-slide: 280ms;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--aw-bg); color: var(--aw-ink); }
      body { font: 400 14px/1.4 var(--aw-sans); -webkit-font-smoothing: antialiased; }
      canvas { display: block; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
      button { font: inherit; }
      :focus-visible { outline: 2px solid var(--aw-ink-bright); outline-offset: 2px; }

      /* ---------------------------------------------------------------- headings */
      .aw-heading { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--aw-ink-3); }

      /* ---------------------------------------------------------------- buttons */
      .aw-byoa-copy {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        box-sizing: border-box; min-height: var(--aw-tap); padding: 0 14px; border: 0; border-radius: 999px;
        background: var(--aw-raise); color: var(--aw-ink); font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap;
        cursor: pointer; user-select: none;
      }
      .aw-byoa-copy:hover { background: var(--aw-raise-hover); }
      .aw-switch { position: relative; }
      .aw-switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
      .aw-switch:has(input:focus-visible) { outline: 2px solid var(--aw-ink-bright); outline-offset: 2px; }

      /* ---------------------------------------------------------------- the wordmark */
      .aw-wordmark { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: var(--aw-ink-bright); }
      /* The waiting panel's wordmark links home: it is the only way out when no match or recording can be shown. */
      .aw-home { color: inherit; text-decoration: none; }
      /* How a match ends, open on first view under the key, in the secondary ink so it reads before the key's. */
      .aw-how { display: block; margin-top: 3px; font-size: 11px; line-height: 1.4; color: var(--aw-ink-2); }

      /* ---------------------------------------------------------------- the score panel */
      .aw-living-foot { display: grid; grid-column: 1 / -1; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 10px; }
      .aw-alive-cell { display: inline-flex; align-items: baseline; gap: 6px; }
      .aw-alive-cell.c1 { flex-direction: row-reverse; }
      .aw-alive { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--aw-ink-bright); }
      .aw-alive.c1 { text-align: right; }
      .aw-full { font-size: 12px; font-weight: 600; color: var(--aw-ink-2); visibility: hidden; }
      .aw-full.is-on { visibility: visible; }
      /* Its castes, each count and noun in a fixed cell: on a narrow panel soldiers over workers, outer-aligned; on a wide
         one a line, mirrored so each count sits under its own stretch of the bar (soldiers outermost). */
      .aw-castes { display: grid; font-size: 12px; line-height: 14px; font-variant-numeric: tabular-nums; color: var(--aw-ink-2); white-space: nowrap; }
      .aw-castes.c1 { justify-items: end; }
      .aw-caste-figure { text-align: right; }
      .aw-caste-sep { display: none; }
      /* Hatched and lost, mirrored, one line of
         fixed height: at each end its colony's hatched, then its lost, each figure in a cell sized for "1,051" and both
         hugging the dot between them, which never moves; the line's one label between the two ends. */
      .aw-tally { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: 18px; align-items: center; column-gap: 8px; }
      .aw-tally-side { display: inline-flex; align-items: baseline; gap: 4px; font-size: 12px; line-height: 14px; font-variant-numeric: tabular-nums; color: var(--aw-ink-2); white-space: nowrap; }
      .aw-tally-side.c1 { justify-self: end; }
      .aw-tally-hatched { text-align: right; }
      .aw-tally .aw-tally-title { justify-self: center; }
      /* A 360 px phone's panel: the label at the landscape layout's tracking, so the figures at their widest stay clear of it. */
      @container (max-width: 300px) {
        .aw-tally .aw-tally-title, .aw-queens .aw-queens-title { letter-spacing: 0.08em; }
      }
      /* The row's label between the two colonies' queens, on their slots' line. */
      .aw-queens-title { align-self: start; line-height: 14px; }
      .aw-queens-title, .aw-tally-title { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--aw-ink-3); white-space: nowrap; }
      /* A wide panel: the same lines. Each colony's castes take one line, mirrored, the right
         side's soldiers outermost as its bar's are. */
      @container (min-width: 520px) {
        .aw-castes { display: flex; align-items: baseline; gap: 6px; }
        .aw-castes.c1 { flex-direction: row-reverse; }
        .aw-caste-sep { display: inline; }
      }
      /* Wider than a phone the board keeps its size, so the hatched and lost line's height
         comes out of the card's own spacing, never its type and never a row: the clock's two lines and the rows' lines
         set to their text, one pixel between rows, and less padding under the queens' second line, which already leaves
         a line's room at the card's foot. Phones keep their own values (that line is 16 px there). */
      @media (min-width: 701px) and (min-height: 501px) {
        .aw-tally { grid-template-rows: 14px; }
      }
      /* ---------------------------------------------------------------- a recording that cannot play (web/src/replay.ts) */
      #aw-recording-error { position: fixed; z-index: 100; left: 12px; right: 12px; bottom: 12px; padding: 12px; color: #fff; background: #501d19; font-size: 14px; }

      /* ---------------------------------------------------------------- a colony's card */
      .aw-card-note { margin: 0; font-size: 11px; line-height: 1.4; color: var(--aw-ink-2); }

      /* ---------------------------------------------------------------- lower third */
      .aw-story-card .aw-locate { grid-area: act; margin-left: 4px; }

      /* ---------------------------------------------------------------- tooltips */
      /* Hover and tap details in the page's own type, above every panel, never clipped: a plate beside what was
         pointed at (web/src/tip.ts), its edge and head in the owner's shade, taking no pointer. */
      .aw-tip {
        position: fixed; z-index: 4; pointer-events: none; box-sizing: border-box; display: grid; gap: 5px;
        max-width: min(300px, calc(100vw - 16px)); padding: 7px 11px 7px 10px;
        border-left: 3px solid currentColor; border-radius: 10px; background: var(--aw-surface); box-shadow: inset 0 0 0 1px var(--aw-line);
        font-size: 12px; line-height: 1.35; color: var(--aw-ink);
      }
      .aw-tip-row { display: grid; gap: 1px; min-width: 0; }
      .aw-tip-head { font-weight: 700; overflow-wrap: anywhere; }
      .aw-tip-body { color: var(--aw-ink); overflow-wrap: anywhere; }
      .aw-tip-meta, .aw-tip-more { font-size: 11px; color: var(--aw-ink-3); font-variant-numeric: tabular-nums; }

      .aw-deaths-line { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: inherit; gap: 4px 10px; }
      .aw-deaths { display: inline-flex; align-items: baseline; gap: 6px; }
      .aw-deaths-title { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--aw-ink-3); }
      .aw-deaths-total { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--aw-ink-bright); }
      .aw-deaths-split { color: var(--aw-ink-2); font-variant-numeric: tabular-nums; }

      /* ---------------------------------------------------------------- sheets */
      .aw-chat-explainer { margin: 0 0 12px; font-size: 12px; line-height: 1.45; color: var(--aw-ink-2); }

      .aw-rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; min-height: 0; overflow-y: auto; font-size: 13px; line-height: 1.5; color: var(--aw-ink); }
      .aw-rule-name { color: var(--aw-ink-bright); }

      /* ---------------------------------------------------------------- the agent address row */
      .aw-byoa-address { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
      .aw-byoa-url { font: 500 13px/1.4 var(--aw-mono); color: var(--aw-ink-bright); background: var(--aw-raise); border-radius: 8px; padding: 6px 10px; user-select: all; overflow-wrap: anywhere; }
      .aw-byoa-copy { min-height: 32px; }
      .aw-byoa-note { font-size: 12px; color: var(--aw-ink-2); }

      /* ---------------------------------------------------------------- the finale */
      @keyframes aw-from-left { from { transform: translateX(calc(-100% - var(--aw-gutter))); } }

      /* ---------------------------------------------------------------- the waiting panel */
      .aw-waiting { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; box-sizing: border-box; width: min(600px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow-y: auto; padding: 24px 28px 14px; text-align: left; background: var(--aw-surface); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--aw-line); font-size: 14px; line-height: 1.5; }
      .aw-waiting[hidden] { display: none; }
      .aw-waiting p { margin: 0; }
      .aw-waiting .aw-wait-state { margin-bottom: 6px; font-weight: 600; color: var(--aw-ink-bright); }
      .aw-waiting > .aw-heading { margin: 0 0 12px; font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; text-transform: none; color: var(--aw-ink-bright); }

      /* ---------------------------------------------------------------- phones, portrait */
      @media (max-width: 700px) {
        :root { --aw-tap: 44px; }
        .aw-wordmark { font-size: 22px; }
        .aw-tally { grid-template-rows: 15px; }
        .aw-how[role="button"] { cursor: pointer; }
        .aw-how[role="button"]::after { content: " ▾"; font-size: 12px; }
        .aw-how[role="button"][aria-expanded="true"]::after { content: " ▴"; }
        .aw-how[role="button"]:focus-visible { outline: 2px solid var(--aw-ink-bright); outline-offset: 2px; }
        .aw-chat-explainer { margin-bottom: 8px; line-height: 1.35; }
        .aw-waiting { padding: 16px 16px 8px; font-size: 13px; }
        .aw-waiting > .aw-heading { font-size: 22px; }
      }

      /* ---------------------------------------------------------------- phones, landscape */
      @media (max-height: 500px) and (min-width: 501px) {
        :root { --aw-tap: 44px; }
        .aw-wordmark { font-size: 20px; }
        .aw-queens-title, .aw-tally-title { letter-spacing: 0.08em; }
        .aw-tally { grid-template-rows: 15px; }
        .aw-how { display: none; }
        .aw-waiting { padding: 12px 14px 6px; font-size: 12px; }
        .aw-waiting > .aw-heading { font-size: 20px; }
      }
      /* Reserve a stable directory band below the landscape board, above its thought/zoom row.
         Closed and open disclosure use the same band; content keeps its existing internal scroll. */
      @media (max-height: 500px) and (min-width: 501px) {
        .aw-directory-band[data-directory-layout="landscape"] {
          grid-area: directory; min-height: 0; min-width: 0; padding: 0 12px;
          box-sizing: border-box; pointer-events: auto; overflow: hidden;
        }
        .aw-directory-band[data-directory-layout="landscape"] > #aw-match-directory {
          min-width: 0; max-height: 100%; width: 100%; box-sizing: border-box;
        }
        /* The native lobby trigger shares the existing band, without another stage reservation. */
        .aw-directory-band[data-directory-layout="landscape"][data-lobby] {
          display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 8px; align-items: start;
        }
        .aw-directory-band[data-directory-layout="landscape"][data-lobby-layout="stacked"] {
          grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) max-content;
        }
        .aw-directory-band[data-directory-layout="landscape"][data-lobby] > #aw-match-directory { min-height: 0; }
        .aw-directory-band[data-directory-layout="landscape"] > .aw-lobby-open { align-self: start; }
      }
      .aw-deaths-line { justify-content: center; gap: 2px 10px; font-size: 11px; }
      .aw-deaths-total { font-size: 13px; }
      .aw-chat-panel .aw-chat-explainer { flex: none; }

      .aw-waiting:not([data-needs-webgl]) { text-align: center; background: transparent; box-shadow: none; }
      .aw-waiting .aw-wordmark { margin-bottom: 12px; }

      /* A portrait directory has one bounded row, whether open or closed. Its contents scroll inside
         the row; the stage allocator receives only the space left by all ordinary page rows. */
      @media (max-width: 700px) and (min-height: 501px) {
        .aw-directory-band { grid-area: directory; min-width: 0; min-height: 0; height: var(--aw-directory-height); pointer-events: auto; }
      }

      /* ---------------------------------------------------------------- replay transport */
      .aw-replay-controls { grid-area: transport; display: grid; grid-template-columns: auto minmax(44px, 1fr) auto; align-items: center; gap: 0 8px; min-width: 0; width: 100%; pointer-events: auto; font-size: 12px; }
      .aw-replay-controls label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
      .aw-replay-controls select { box-sizing: border-box; min-width: 60px; min-height: 44px; border: 1px solid var(--aw-line); border-radius: 8px; padding: 0 4px; background: var(--aw-raise); color: var(--aw-ink); font: inherit; }
      .aw-replay-controls input { box-sizing: border-box; width: 100%; min-width: 44px; min-height: 44px; margin: 0; accent-color: var(--aw-ink-bright); cursor: pointer; }
      .aw-replay-time { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 11px; }
      .aw-replay-state { grid-column: 1 / -1; min-height: 17px; font-size: 11px; line-height: 17px; }
    </style>
  </head>
  <body>
    <div class="aw-waiting" id="aw-waiting" role="status">
      <p class="aw-wordmark"><a class="aw-home" href="/" aria-label="Antwars home">Antwars</a></p>
      <p class="aw-wait-state">Connecting…</p>
    </div>
    <script type="module" src="./src/leaderboard-page/entry.ts"></script>
  </body>
</html>
